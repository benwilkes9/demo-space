# The corpus gate, run where it cannot be skipped.
#
# `.githooks/pre-push` runs the same validator, but only in a clone that has set
# `core.hooksPath` — so it is trust-per-clone, and the first contributor who has
# not set it pushes straight past it. The platform reads this corpus live over the
# GitHub Contents API with no build in between, so an invalid page merged here is
# immediately what every reader sees. This workflow is the copy nobody can bypass.
#
# The validator version is PINNED, and pinned to the same value the hook names, so
# a stricter rule reaches this repository only when somebody bumps both
# deliberately (ADR-0035 in the platform's corpus).
name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: only the newest commit's result matters.
concurrency:
  group: validate-corpus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Frontmatter, folder placement, story ids and link targets. It cannot tell
      # you a page is WRONG — only that it is well-formed and its links resolve.
      - name: Validate
        run: npx --yes "@equalexperts/asf-corpus-validate@0.1.0" context-repository
